function nrd(u){return topbar('Neon Rivals')+`<div class=card><div style="display:flex;gap:12px;align-items:center"><div class=gc style="margin:0;cursor:default"><div class=ic>🔫</div></div><div><h2 style="margin:0">Neon Rivals</h2><span class=mut>${T('Avatarová 3D arena shooter.','Avatar 3D arena shooter.')}</span></div></div><div class=grid style="margin:14px 0"><div class=ai style="--rc:#39f6ff"><b style="font-size:24px">👍 5 060</b><div class=mut>${T('LIKŮ · 99%','LIKES · 99%')}</div></div><div class=ai style="--rc:#b6ff3b"><b style="font-size:24px">👥 915</b><div class=mut>${T('HRÁČŮ PŘIPOJENO','PLAYERS ONLINE')}</div></div></div><button class=w style="font-size:20px" onclick="go('nr',{back:'nrd'})">▶ ${T('PŘIPOJIT SE','JOIN')}</button><h3 style="margin-top:18px">🌐 ${T('Servery','Servers')}</h3>${[['Afterglow Grid','Asia',12,277],['Cyber Pulse','EU East',76,887]].map(s=>`<div class=row><b>${s[0]}</b><span>${s[1]} <span class=ok>${s[2]} ms</span> 👥 ${s[3]}</span></div>`).join('')}</div>`}

function nr(u){S.back='nrd';const tb=[['modes','⚔️ MODES'],['shop','🔫 SHOP'],['owned','🎒 OWNED'],['slots','⚙️ SLOTS'],['chests','🎁 CHESTS']];
let h=`<div class=top><button class=ib onclick="S.back='home';go('nrd')">←</button><b>Neon Rivals</b><b style="color:var(--c);font-size:22px">LVL ${u.level}</b></div><div class=card style="padding:10px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:44px">🔫</span><span class=mut>3D ARENA SHOOTER</span></div><div class=tabs>${tb.map(t=>`<span class="chip ${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';R()">${t[1]}</span>`).join('')}<span class=pill>◈ ${fmt(u.neon)}</span></div>`;
const wc=(n,btn)=>{const w=W[n];return`<div class=it style="--rc:${RC[w[0]]}"><span class=r>${w[0].toUpperCase()}</span><b>${n}</b><div class=mut style="margin:6px 0">${w[1]?`DMG ${w[1]} · ROF ${w[2]}/s · ACC ${w[3]}%`:`HEALS 35 HP · 50 use/s`}</div>${btn}</div>`};
if(S.tab=='modes'){h+=`<div class=tabs>${[['training','TRAINING'],['team','TEAM'],['1v5','1V5']].map(m=>`<span class="chip ${S.mode==m[0]?'on':''}" onclick="S.mode='${m[0]}';R()">${m[1]}</span>`).join('')}</div><div class=hdr>🌐 MULTIPLAYER ROOMS // PLAY WITH FRIENDS</div>`;
if(S.room){h+=`<div style="text-align:center"><span class=pill style="font-size:26px;letter-spacing:8px;color:var(--c)">${S.room}</span><p style="color:var(--c)">Send this code to your friend — they join via JOIN ROOM.</p><div class=grid><div class=ai style="--rc:var(--c)">👤<br>YOU</div>${[1,2,3].map(()=>`<div class=ai style="--rc:var(--bd)">?<br><span class=mut>Waiting...</span></div>`).join('')}</div><p class=mut>Players in room</p><b style="font-size:46px;color:var(--c)">1</b><br><button class=w onclick="match('team')">START MATCH (TEAM)</button><br><br><button class="o w" onclick="S.room=null;R()">LEAVE ROOM</button></div>`}
else{h+=`<button class="o w" onclick="S.room=Math.random().toString(36).slice(2,8).toUpperCase();R()">＋ CREATE ROOM</button><div style="display:flex;gap:8px;margin-top:8px"><input id=rc placeholder="ROOM CODE"><button onclick="alert('${T('Místnost nenalezena','Room not found')}')">JOIN</button></div><h3 style="text-align:center;color:var(--c)">LOBBY</h3><p class=mut style="text-align:center">${S.mode=='1v5'?'1V5 CHALLENGE — no allies, 5 enemy waves solo. Clear all 5 rounds to win!':S.mode=='team'?'TEAM — fight with bots, 3 rounds.':'TRAINING — warm up on 1 wave.'}</p><div class=ai style="--rc:var(--bd)"><span class=mut>Current Weapon:</span><br><b style="color:var(--p);font-size:20px">${u.eq}</b></div><br><div style="display:flex;gap:8px"><button class=o onclick="S.tab='shop';R()">🛒 SHOP</button><button class=o onclick="match(S.mode)">JOIN MATCH</button></div>`}}
if(S.tab=='shop'){const b=bunNow(),left=300-Math.floor(Date.now()/1e3)%300,own=b[1].every(n=>u.own.includes(n));
h+=`<div class=it style="--rc:var(--c)"><span class=r>BUNDLE</span><b>📦 ${b[0]}</b><div class=mut>MEGA OP // 3 EXCLUSIVE WEAPONS</div>${b[1].map(n=>`<div style="margin:6px 0">🔫 ${n}</div>`).join('')}<div class=mut>⏳ ${T('Rotuje za','Rotates in')} ${Math.floor(left/60)}:${(left%60+'').padStart(2,'0')}</div>${own?`<button class=o disabled>✓ OWNED</button>`:`<button onclick="buyB()">BUY ◈ ${fmt(price(20000))}</button>`}</div><p class=mut>Bundles contain ONLY MEGA OP weapons — exclusive to bundles. Rotation every 5 minutes!</p><div class=hdr>🎁 CHEST SHOP // WEAPONS & SKINS INSIDE</div>${CH.map(c=>`<div class=it style="--rc:${RC[c[0]]}"><span class=r>${c[2]}% DROP</span><b>🎁 ${c[0].toUpperCase()} CHEST</b><div class=mut style="margin-top:6px">1 RANDOM ITEM // WEAPON OR SKIN</div><button onclick="buyC('${c[0]}')">BUY CHEST ◈ ${fmt(price(c[1]))}</button></div>`).join('')}<p class=mut>Chest-exclusive weapons & skins can NOT be bought anywhere else — open chests to get them!</p><div class=tabs style="font-size:12px">${RR.map(r=>`<b style="color:${RC[r]}">${r.toUpperCase()}</b>`).join(' ')}</div>`;
h+=Object.keys(W).filter(n=>W[n][5]=='s').map(n=>wc(n,u.own.includes(n)?`<button class=o onclick="eq('${n}')">${u.eq==n?'✓ EQUIPPED':'EQUIP'}</button>`:`<button onclick="buyW('${n}')">BUY ◈ ${fmt(price(W[n][4]))}</button>`)).join('')}
if(S.tab=='owned')h+=u.own.map(n=>wc(n,`<button class=o onclick="eq('${n}')">${u.eq==n?'✓ EQUIPPED':'EQUIP'}</button>`)).join('');
if(S.tab=='slots')h+=`<div class=hdr>🎒 LOADOUT // MAX 4 WEAPONS</div>`+u.own.map(n=>{const i=u.slots.includes(n);return wc(n,i?`<button class=o onclick="slot('${n}')">REMOVE</button>`:u.slots.length>=4?`<button disabled>LOADOUT FULL</button>`:`<button onclick="slot('${n}')">ADD</button>`)}).join('');
if(S.tab=='chests')h+=`<div class=hdr>🎁 CHEST INVENTORY // OPEN TO REVEAL</div>`+(Object.keys(u.chests).filter(k=>u.chests[k]>0).map(k=>`<div class=it style="--rc:${RC[k]}"><span class=r>x${u.chests[k]}</span><b>🎁 ${k.toUpperCase()} CHEST</b><button onclick="openC('${k}')">OPEN CHEST</button></div>`).join('')||`<p class=mut>${T('Žádné chesty','No chests')}</p>`)+`<div class=hdr>🎲 DROP RATES</div>${CH.map(c=>`<div class=row><b style="color:${RC[c[0]]}">${c[0].toUpperCase()}</b><span>${c[2]}%</span></div>`).join('')}`;
return h+'</div>'}
function eq(n){me().eq=n;save();R()}function slot(n){const u=me();u.slots=u.slots.includes(n)?u.slots.filter(x=>x!=n):[...u.slots,n];save();R()}
function buyW(n){const u=me();if(pay(price(W[n][4]))){u.own.push(n);save();R()}}
function buyB(){const u=me(),b=bunNow();if(pay(price(20000))){b[1].forEach(n=>!u.own.includes(n)&&u.own.push(n));save();R()}}
function buyC(k){const u=me(),c=CH.find(x=>x[0]==k);if(pay(price(c[1]))){u.chests[k]=(u.chests[k]||0)+1;save();R()}}
function openC(k){const u=me(),pool=Object.keys(W).filter(n=>W[n][0]==k&&W[n][5]!='b');u.chests[k]--;const n=pool[Math.floor(Math.random()*pool.length)];let m;if(u.own.includes(n)){const r=Math.round((W[n][4]||CH.find(c=>c[0]==k)[1])/2);u.neon+=r;m=T(`Duplikát ${n} → +${r} Neoníků`,`Duplicate ${n} → +${r} Neons`)}else{u.own.push(n);m=`🎉 ${n} (${k.toUpperCase()})`}save();alert(m);R()}
function match(mode){const u=me(),w=W[u.eq]||W['Pulse Blaster'],rounds=mode=='1v5'?5:mode=='training'?1:3,d=document.createElement('div');d.id='mt';d.innerHTML=`<div class=ctl><span id=hud></span><button class=o onclick="end(0)">← LEAVE MATCH</button></div><canvas id=cv width=300 height=400></canvas><div class=ctl><div class=dp><span></span><button data-k=u>▲</button><span></span><button data-k=l>◀</button><button data-k=d>▼</button><button data-k=r>▶</button></div><button style="width:110px;height:110px;border-radius:50%;background:var(--p)" id=fire>FIRE</button></div>`;document.body.appendChild(d);
const cv=$('#cv'),g=cv.getContext('2d'),K={};let r=1,hp=100,P={x:150,y:340},E=[],B=[],last=0,run=1;
const spawn=()=>{E=[];for(let i=0;i<2+r*(mode=='training'?1:1);i++)E.push({x:30+Math.random()*240,y:20+Math.random()*80,h:60+r*25})};spawn();
d.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();K[k]=1},off=()=>K[k]=0;b.onpointerdown=on;b.onpointerup=b.onpointerleave=off});
const kb={w:'u',a:'l',s:'d',d:'r',ArrowUp:'u',ArrowLeft:'l',ArrowDown:'d',ArrowRight:'r'};onkeydown=e=>{if(kb[e.key])K[kb[e.key]]=1;if(e.key==' ')fire()};onkeyup=e=>{if(kb[e.key])K[kb[e.key]]=0};
function fire(){const t=performance.now();if(t-last<Math.max(90,40000/w[2]))return;last=t;if(!w[1]){hp=Math.min(100,hp+35);return}let n=null,m=1e9;E.forEach(e=>{const q=(e.x-P.x)**2+(e.y-P.y)**2;if(q<m){m=q;n=e}});if(n){const a=Math.atan2(n.y-P.y,n.x-P.x);B.push({x:P.x,y:P.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9})}}
$('#fire').onpointerdown=e=>{e.preventDefault();fire()};
window.end=win=>{run=0;onkeydown=onkeyup=null;let m='';if(win!==0){const rw=win?150+rounds*50:20;u.neon+=rw;u.q.p+=rw;u.games++;if(win){u.level++;u.q.w+=mode!='training'?1:0;u.ranked+=mode!='training'?1:0}u.q.g++;u.best=Math.max(u.best,rw*10+hp);m=win?`🏆 WIN +${rw} ◈`:`💀 LOSE +${rw} ◈`}else m='';save();d.remove();if(m)alert(m);R()};
(function loop(){if(!run)return;if(K.l)P.x-=3;if(K.r)P.x+=3;if(K.u)P.y-=3;if(K.d)P.y+=3;P.x=Math.max(10,Math.min(290,P.x));P.y=Math.max(10,Math.min(390,P.y));
B.forEach(b=>{b.x+=b.vx;b.y+=b.vy;E.forEach(e=>{if((e.x-b.x)**2+(e.y-b.y)**2<225){e.h-=w[1];b.x=-99}})});B=B.filter(b=>b.x>0&&b.x<300&&b.y>0&&b.y<400);E=E.filter(e=>e.h>0);
E.forEach(e=>{const a=Math.atan2(P.y-e.y,P.x-e.x),s=.5+r*.12;e.x+=Math.cos(a)*s;e.y+=Math.sin(a)*s;if((e.x-P.x)**2+(e.y-P.y)**2<300)hp-=.35});
if(hp<=0)return end(false);if(!E.length){if(r>=rounds)return end(true);r++;spawn()}
g.clearRect(0,0,300,400);g.fillStyle='#39f6ff';g.fillRect(P.x-8,P.y-8,16,16);g.fillStyle='#ff3ea5';E.forEach(e=>g.fillRect(e.x-8,e.y-8,16,16));g.fillStyle='#b6ff3b';B.forEach(b=>g.fillRect(b.x-2,b.y-2,5,5));
$('#hud').textContent=`❤ ${Math.max(0,Math.round(hp))}  ROUND ${r}/${rounds}  ${u.eq}`;requestAnimationFrame(loop)})()}

function avs(u){const tb=`<div class=tabs><span class="chip ${S.av=='shop'?'on':''}" onclick="S.av='shop';R()">${T('OBCHOD','SHOP')}</span><span class="chip ${S.av=='room'?'on':''}" onclick="S.av='room';R()">${T('OBLÉKACÍ MÍSTNOST','WARDROBE')}</span></div>`;let h=topbar('AVATAR SHOP',pil(u))+tb;

function claim(i,r){const u=me();u.q.c[i]=1;u.neon+=r;save();R()}
function prem(u){return topbar('PREMIUM')+`<div class=card style="text-align:center"><h3>💎 ${T('Měsíční Premium','Monthly Premium')}</h3><div style="font-size:30px">◈ 2000</div><p class=mut>${T('Neoníků / měsíc','Neons / month')}</p>${u.prem?`<button class=o w disabled style="width:100%;color:var(--g)">✓ ${T('PREMIUM AKTIVNÍ','PREMIUM ACTIVE')}</button>`:`<button class=w onclick="if(pay(2000)){me().prem=1;save();R()}">${T('AKTIVOVAT','ACTIVATE')}</button>`}</div><div class=card><h3>✨ ${T('Výhody Premium','Premium perks')}</h3>${['🎨 20% sleva na všechny položky v obchodě','👑 Exkluzivní u profilu','🎮 Přístup k exkluzivním hrám','⭐ Dvojnásobné odměny z denních questů','💫 Speciální neonové efekty','🎧 Přednostní podpora'].map(x=>`<div class=row>${x}</div>`).join('')}</div>`}
function adm(u){if(u.rank!='Owner')return go('home');const us=Object.values(DB.u),adms=us.filter(x=>x.rank!='Hráč');return topbar('ADMIN PANEL')+`<div class=card><h3>🛡️ ADMIN PANEL</h3><span class=mut>${T('Vítej','Welcome')}, <b style="color:#fff">${u.name}</b>!</span></div><div class=card><h3>👥 ${T('Uživatelé','Users')}</h3><div class=mut>${T('Celkem uživatelů','Total users')}: <b>${us.length}</b><br>${T('Neoníky v oběhu','Neons in circulation')}: <b class=ok>◈ ${fmt(us.reduce((a,x)=>a+x.neon,0))}</b></div>${us.map(x=>`<div class=row><b>${x.name}${x==u?' (YOU)':''} <small class=pk>${x.rank!='Hráč'?x.rank:''}</small></b><span style="color:var(--c)">◈ ${fmt(x.neon)}</span></div>`).join('')}</div><div class=card><h3>📢 Broadcast</h3><div style="display:flex;gap:6px"><input id=bm placeholder="${T('Zpráva...','Message...')}"><button onclick="DB.bc=$('#bm').value;save();R()">SEND</button></div></div><div class=card><h3>💰 ${T('Správa měny','Currency')}</h3><input id=an placeholder="${T('Jméno hráče...','Player name...')}"><input id=am type=number placeholder="${T('Částka...','Amount...')}"><div style="display:flex;gap:8px"><button style="flex:1" onclick="adC(1)">+ ADD</button><button class=o style="flex:1" onclick="adC(-1)">- REMOVE</button></div></div><div class=card><h3>🔫 ${T('Předání zbraní','Give weapon')}</h3><input id=wn placeholder="${T('Jméno hráče...','Player name...')}"><select id=ws>${Object.keys(W).map(n=>`<option>${n}</option>`)}</select><button class=w onclick="adW()">+ ${T('PŘEDAT ZBRAŇ','GIVE WEAPON')}</button></div><div class=card><h3>🎁 ${T('Předání chestek','Give chest')}</h3><input id=cn placeholder="${T('Jméno hráče...','Player name...')}"><select id=cs>${CH.map(c=>`<option value=${c[0]}>${c[0].toUpperCase()} CHEST — ${c[2]}% DROP</option>`)}</select><button class=w onclick="adCh()">+ ${T('PŘEDAT CHESTKU','GIVE CHEST')}</button></div><div class=card><h3>📇 ${T('Katalog uživatelských jmen','Username catalog')}</h3>${NAMES.map(n=>`<div class=row><b>${n}</b><b class="${DB.u[n]?'pk':'ok'}">${DB.u[n]?'POUŽITO':'VOLNÉ'}</b></div>`).join('')}</div><div class=card><h3>🛡️ Admin list</h3>${adms.map(x=>`<div class=row><b class=ok>${x.name}${x==u?' (YOU)':''}</b><span class=mut>${x.rank}</span></div>`).join('')}<div style="display:flex;gap:6px;margin-top:8px"><input id=pn placeholder="${T('Jméno hráče k povýšení','Player to promote')}"><button onclick="adP()">+ ${T('POVÝŠIT','PROMOTE')}</button></div></div>`}
const tgt=id=>{const u=DB.u[$('#'+id).value.trim()];if(!u)alert(T('Hráč nenalezen','Player not found'));return u};
function adC(s){const u=tgt('an'),a=+$('#am').value;if(u&&a){u.neon=Math.max(0,u.neon+s*a);save();R()}}
function adW(){const u=tgt('wn'),n=$('#ws').value;if(u&&!u.own.includes(n)){u.own.push(n);save();alert('✓')}}
function adCh(){const u=tgt('cn'),k=$('#cs').value;if(u){u.chests[k]=(u.chests[k]||0)+1;save();alert('✓')}}
function adP(){const u=tgt('pn');if(u&&u.rank=='Hráč'){u.rank='Admin';save();R()}}
function R(keep){const u=me(),A=$('#app');document.body.className=(u?u.bg:'neon')+(u&&u.pc?' pc':'');if(!u){A.innerHTML=auth();return}
const P={home,nrd,nr,set:setS,av:avs,q:qs,prem,adm};if(S.page!='nr'&&S.page!='nrd')S.back='home';const h=P[S.page](u);if(h===undefined)return;A.innerHTML=h;if(keep){const i=$('#sq');i.focus();i.setSelectionRange(99,99)}}
R();
</script></body></html>
